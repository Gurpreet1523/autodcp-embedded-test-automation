name: AutoDCP Test Automation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          mkdir -p reports
          python -m pytest -v --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodcp-test-reports
          path: reports/
